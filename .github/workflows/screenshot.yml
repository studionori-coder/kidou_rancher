name: Screenshot

# サンプル設定（個人データなし）でアプリを起動し、画面のスクリーンショットを成果物として保存する
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Japanese fonts if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR\Fonts\YuGothM.ttc")) {
            Add-WindowsCapability -Online -Name 'Language.Fonts.Jpan~~~und-JPAN~0.0.1.0' | Out-Null
          }

      - run: dotnet publish src/KidouRancher/KidouRancher.csproj -c Release -o app

      - name: Capture
        shell: pwsh
        run: .github/screenshot/capture.ps1 -ExePath "$PWD/app/KidouRancher.exe" -OutputPath "$PWD/screenshot.png"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png

      # 成果物をダウンロードできない環境からも確認できるよう、ログにも Base64 で出力する
      - name: Print screenshot as Base64
        shell: pwsh
        run: |
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/screenshot.png"))
          Write-Host 'SCREENSHOT-BASE64-BEGIN'
          for ($i = 0; $i -lt $base64.Length; $i += 1000) {
            Write-Host ('B64:' + $base64.Substring($i, [Math]::Min(1000, $base64.Length - $i)))
          }
          Write-Host 'SCREENSHOT-BASE64-END'
