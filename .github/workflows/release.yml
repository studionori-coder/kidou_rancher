name: Release

# 次のどちらかで配布用の exe を作成し、GitHub Releases に公開する。
# - v1.0.0 のようなタグを push する
# - Actions タブから「Release」を選び、バージョンを入力して手動実行する
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（例: 1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet test KidouRancher.slnx

      - name: Publish
        run: >
          dotnet publish src/KidouRancher/KidouRancher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "KidouRancher-${{ steps.version.outputs.version }}-win-x64.zip"
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
